spring:
  application:
    name: api-gateway

  cloud:
    gateway:




      # Booking Service
      # - id: booking-service
      #   uri: http://localhost:8084
      #   predicates:
      #     - Path=/api/v1/properties/*/bookings/**, /api/v1/bookings/**

      # Payment Service
      # - id: payment-service
      #   uri: http://localhost:8085
      #   predicates:
      #     - Path=/api/v1/payments/**



      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/me/**

            - id: property-service
              uri: lb://property-service
              predicates:
                - Path=/api/v1/properties/**

            - id: chat-service
              uri: lb://chat-service
              predicates:
               - Path=/api/v1/chats/**

          discovery:
            locator:
              enabled: on


server:
  port: 8080

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8081/eureka
logging:

  pattern:
        console: '%C{1.} [%-5level] %d{HH:mm:ss} - %msg%n'
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
